name: Car Launcher APK

on:
  push:
    paths:
      - "car-launcher/**"
      - ".github/workflows/car-launcher.yml"
  pull_request:
    paths:
      - "car-launcher/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: car-launcher
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: car-launcher-apk
          path: car-launcher/app/build/outputs/apk/debug/*.apk
